---
name: Cue Sync Tests

on:
  push:
    paths:
      - '.just/cue-verify.just'
      - '.just/clean-template.just'
      - '.just/gh-process.just'
      - '.just/testing.just'
      - '.just/lib/cue_sync.awk'
      - '.just/lib/cue_sync_test.sh'
      - '.just/lib/repo_urls.sh'
      - '.just/lib/repo_urls_test.sh'
      - '.just/lib/asciinema_cache_test.sh'
      - '.just/test/fixtures/cue_sync/**'
      - '.just/test/fixtures/repo_urls/**'
      - '.just/test/fixtures/asciinema_cache/**'
      - '.github/workflows/cue-sync-tests.yml'
  pull_request:
    paths:
      - '.just/cue-verify.just'
      - '.just/clean-template.just'
      - '.just/gh-process.just'
      - '.just/testing.just'
      - '.just/lib/cue_sync.awk'
      - '.just/lib/cue_sync_test.sh'
      - '.just/lib/repo_urls.sh'
      - '.just/lib/repo_urls_test.sh'
      - '.just/lib/asciinema_cache_test.sh'
      - '.just/test/fixtures/cue_sync/**'
      - '.just/test/fixtures/repo_urls/**'
      - '.just/test/fixtures/asciinema_cache/**'
      - '.github/workflows/cue-sync-tests.yml'

# global permissions
permissions: {}

jobs:
  cue-sync-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # repo_urls_test.sh drives the real cue-sync-from-github recipe in
      # a shimmed workspace, which needs cue (jq ships with the runner)
      - name: Install CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0

      - name: Make test scripts executable
        run: |
          chmod +x .just/lib/cue_sync_test.sh
          chmod +x .just/lib/repo_urls_test.sh
          chmod +x .just/lib/asciinema_cache_test.sh

      - name: Run cue-sync tests
        run: just cue_sync_test

      - name: Run repo_urls tests
        run: just repo_urls_test

      - name: Run asciinema cache tests
        run: just asciinema_cache_test
