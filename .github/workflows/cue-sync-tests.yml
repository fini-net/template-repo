---
name: Cue Sync Tests

on:
  push:
    paths:
      - '.just/cue-verify.just'
      - '.just/lib/cue_sync.awk'
      - '.just/lib/cue_sync_test.sh'
      - '.just/test/fixtures/cue_sync/**'
      - '.github/workflows/cue-sync-tests.yml'
  pull_request:
    paths:
      - '.just/cue-verify.just'
      - '.just/lib/cue_sync.awk'
      - '.just/lib/cue_sync_test.sh'
      - '.just/test/fixtures/cue_sync/**'
      - '.github/workflows/cue-sync-tests.yml'

# global permissions
permissions: {}

jobs:
  cue-sync-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Make test script executable
        run: chmod +x .just/lib/cue_sync_test.sh

      - name: Run cue-sync tests
        run: just cue_sync_test
