---
name: Wait for Copilot Tests

on:
  push:
    branches: [main]
    paths:
      - '.just/lib/wait_for_copilot.sh'
      - '.just/lib/wait_for_copilot_test.sh'
      - '.just/test/fixtures/wait_for_copilot/**'
      - '.github/workflows/wait-for-copilot-tests.yml'
  pull_request:
    paths:
      - '.just/lib/wait_for_copilot.sh'
      - '.just/lib/wait_for_copilot_test.sh'
      - '.just/test/fixtures/wait_for_copilot/**'
      - '.github/workflows/wait-for-copilot-tests.yml'

# global permissions
permissions: {}

jobs:
  wait-for-copilot-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make scripts executable
        run: |
          chmod +x .just/lib/wait_for_copilot.sh
          chmod +x .just/lib/wait_for_copilot_test.sh

      - name: Run wait_for_copilot tests
        run: .just/lib/wait_for_copilot_test.sh
