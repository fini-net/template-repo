name: PR Body Update Tests

on:
  pull_request:
    paths:
      - '.just/lib/update_pr_body.sh'
      - '.just/lib/pr_body_test.sh'
      - '.just/test/fixtures/pr_bodies/**'
  push:
    branches: [main]
    paths:
      - '.just/lib/update_pr_body.sh'
      - '.just/lib/pr_body_test.sh'
      - '.just/test/fixtures/pr_bodies/**'

# global permissions
permissions: {}

jobs:
  pr-body-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make scripts executable
        run: |
          chmod +x .just/lib/pr_body_test.sh
          chmod +x .just/lib/update_pr_body.sh
      - name: Run PR body tests
        run: .just/lib/pr_body_test.sh
