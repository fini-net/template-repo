name: Lint GitHub Actions

on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths:
      - '.github/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# global permissions
permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on hosted runners and actionlint uses it
      # automatically for `run:` scripts; verify it's actually there so the
      # checks fail loudly instead of being silently skipped.
      - name: Verify shellcheck is available
        run: shellcheck --version

      # pyflakes is bundled in the old Docker image but NOT on hosted runners.
      # Install it to keep Python `run:` checks.
      - name: Install pyflakes
        run: pipx install pyflakes

      # NOTE: the explicit version arg is required - the script baked into tag
      # v1.7.12 defaults to 1.7.11 (its default always lags the tag).
      - name: Download actionlint
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
        shell: bash

      - name: Check workflow files
        env:
          ACTIONLINT_EXECUTABLE: ${{ steps.get_actionlint.outputs.executable }}
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          "${ACTIONLINT_EXECUTABLE}" -color
        shell: bash
